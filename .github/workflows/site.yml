name: Publier le site

on:
  push:
    branches: [main]
    paths: ["site/**", "pack/**", "src/main/java/com/godmod/command/Help.java", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Construire le site
        run: python3 site/build.py
      - name: Construire le pack de ressources
        run: |
          pip install --quiet pillow
          python3 pack/build_pack.py site/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4

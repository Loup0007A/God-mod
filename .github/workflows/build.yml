name: Compiler le mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compiler le .jar
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Résumer les erreurs
        if: failure()
        run: |
          # Erreurs de compilation Java, puis bloc "What went wrong" de Gradle.
          { grep -E "error:|warning: \[|What went wrong|Could not|Exception|> " -A4 build.log | head -c 60000; } > errors.txt || true
          [ -s errors.txt ] || tail -c 60000 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Erreurs de compilation::$msg"

      - name: Vérifier le contenu du .jar
        run: |
          for j in build/libs/*.jar; do
            list=$(unzip -l "$j" | awk 'NR>3 {print $4}' | grep -E "toml|MANIFEST|GodMod|dimension" | tr '\n' ' ')
            toml=$(unzip -p "$j" META-INF/mods.toml | tr '\n' '|' | head -c 1500)
            echo "::notice title=Contenu du jar::$(basename $j) : $list"
            echo "::notice title=mods.toml::$toml"
          done

      - name: Publier le .jar
        uses: actions/upload-artifact@v4
        with:
          name: godmod-jar
          path: build/libs/*.jar

      - name: Mettre le .jar en téléchargement (release « mod »)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/godmod-*.jar | grep -v -- '-sources' | head -1)
          cp "$JAR" godmod.jar
          gh release view mod -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mod -R "$GITHUB_REPOSITORY" \
            --title "God Civilisation — mod" --notes "Dernière version du mod (serveur + interface client facultative). Pour les joueurs : voir https://loup0007a.github.io/God-mod/#client"
          gh release upload mod godmod.jar --clobber -R "$GITHUB_REPOSITORY"
          gh release edit mod -R "$GITHUB_REPOSITORY" --notes "Version $(basename "$JAR" .jar | sed 's/godmod-//') — mod serveur + interface client facultative. Installation joueur : https://loup0007a.github.io/God-mod/#client"
